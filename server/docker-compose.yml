services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: get-to-the-point-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: get_to_the_point
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: get-to-the-point-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/get_to_the_point
    depends_on:
      - postgres

volumes:
  postgres_data: